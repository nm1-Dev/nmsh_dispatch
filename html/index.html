<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch Alerts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.5h.01"/></symbol>
    <symbol id="icon-move" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3 3 3M12 22l-3-3m3 3 3-3M2 12l3-3m-3 3 3 3M22 12l-3-3m3 3-3 3"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 7v5h5M5.5 16a8 8 0 1 0 .5-9l-2 5"/></symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-radio" viewBox="0 0 24 24"><path d="M5 9a10 10 0 0 1 14 0M8 12a6 6 0 0 1 8 0M11 15a2 2 0 0 1 2 0"/><circle cx="12" cy="18" r="1"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></symbol>
    <symbol id="icon-store" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 4h18l-1 6a3 3 0 0 1-4 2 3 3 0 0 1-4 0 3 3 0 0 1-4 0 3 3 0 0 1-4-2Z"/><path d="M9 20v-5h6v5"/></symbol>
    <symbol id="icon-bank" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5M5 10h14M6 10v8M10 10v8M14 10v8M18 10v8M4 18h16M3 21h18"/></symbol>
    <symbol id="icon-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8"/><circle cx="15" cy="9" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="9" cy="15" r=".8"/><circle cx="15" cy="15" r=".8"/></symbol>
    <symbol id="icon-siren" viewBox="0 0 24 24"><path d="M7 17v-6a5 5 0 0 1 10 0v6M5 17h14v3H5ZM12 2v2M3 8l3 1M21 8l-3 1M5 3l2 3M19 3l-2 3"/></symbol>
    <symbol id="icon-medical" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/></symbol>
    <symbol id="icon-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-3.2 3.2-3-3Z"/></symbol>
    <symbol id="icon-fight" viewBox="0 0 24 24"><path d="m8 9 3 3-5 5-3-3ZM16 9l-3 3 5 5 3-3M8 9l2-5 3 2M16 9l-2-5-3 2"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 20v-1.5c0-2-1.8-3.5-4-3.5H7c-2.2 0-4 1.5-4 3.5V20M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM17 11a3 3 0 0 0 0-6M18 15c1.8.4 3 1.7 3 3.5V20"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 4.3 2.7 18a2 2 0 0 0 1.8 3h15a2 2 0 0 0 1.8-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M6.6 3h3l1.5 4-2 1.7a15 15 0 0 0 6.2 6.2l1.7-2 4 1.5v3c0 2-1.6 3.6-3.6 3.6C9.4 21 3 14.6 3 6.6 3 4.6 4.6 3 6.6 3Z"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
    <symbol id="icon-car" viewBox="0 0 24 24"><path d="m5 16-1.5-1.5V11l2-5h13l2 5v3.5L19 16M5 16h14v3H5Z"/><circle cx="7.5" cy="12.5" r="1"/><circle cx="16.5" cy="12.5" r="1"/></symbol>
    <symbol id="icon-plate" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h5"/></symbol>
    <symbol id="icon-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1 0-4h5a4 4 0 0 0 4-4c0-3.3-4-6-9-6Z"/><circle cx="7" cy="10" r=".7"/><circle cx="9" cy="6.5" r=".7"/><circle cx="14" cy="6.5" r=".7"/></symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M20 13 13 20l-9-9V4h7Z"/><circle cx="8" cy="8" r="1"/></symbol>
    <symbol id="icon-door" viewBox="0 0 24 24"><path d="M5 21h14M7 21V4l10-2v19M13 12h.01"/></symbol>
    <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-5 2 2-5Z"/></symbol>
  </svg>

  <section class="dispatch-card is-entering is-hidden" id="dispatch-card" aria-live="polite" hidden>
    <div class="priority-edge" aria-hidden="true"></div>

    <header class="dispatch-header">
      <div class="header-left">
        <span class="alert-count status-badge" id="alert-count"></span>
        <span class="department-label">
          <span class="brand-mark" aria-hidden="true"></span>
          <span id="department-name"></span>
          <b>•</b>
          <span id="channel-name"></span>
        </span>
      </div>

      <div class="header-right">
        <div class="normal-status">
          <time id="alert-time"></time>
          <button class="clear-alerts" id="clear-alerts" type="button" aria-label="Clear all alerts" title="Clear all alerts">CLEAR</button>
          <span class="priority-badge" id="priority-badge"></span>
        </div>
      </div>
    </header>

    <main class="alert-content" id="alert-content">
      <div class="call-heading">
        <span class="call-type-icon" aria-hidden="true"><svg><use id="call-type-use" href="#icon-radio"></use></svg></span>
        <span class="unit-response status-badge" id="unit-response" aria-label="1 responding unit">
          <svg><use href="#icon-users"></use></svg>
          <span class="unit-count" id="unit-count"></span>
        </span>
        <span class="call-code" id="call-code"></span>
        <span class="heading-divider">•</span>
        <h1 id="call-title"></h1>
      </div>
      <p class="call-description" id="call-description"></p>
      <section class="alert-details" id="alert-details" aria-label="Additional alert details">
        <div class="details-inner">
          <div class="details-heading">
            <span class="section-marker" aria-hidden="true"></span>
            <span>CALL DETAILS</span>
            <span class="details-rule" aria-hidden="true"></span>
          </div>
          <dl class="details-grid" id="details-grid"></dl>
        </div>
      </section>
    </main>

    <footer class="dispatch-controls">
      <button class="control control-previous" id="previous" type="button" aria-label="Previous alert">
        <span class="control-icon" aria-hidden="true"><svg><use href="#icon-chevron-left"></use></svg></span>
        <span>Previous</span>
      </button>

      <button class="control control-respond" id="respond" type="button" aria-label="Respond to alert">
        <kbd id="respond-key">G</kbd>
        <span id="respond-label">Respond</span>
      </button>

      <button class="control control-next" id="next" type="button" aria-label="Next alert">
        <span>Next</span>
        <span class="control-icon" aria-hidden="true"><svg><use href="#icon-chevron-right"></use></svg></span>
      </button>
    </footer>
  </section>

  <nav class="edit-toolbar" id="edit-toolbar" aria-label="Dispatch panel editing tools" aria-hidden="true">
    <button class="edit-tool info-toggle" id="info-toggle" type="button" aria-label="Show alert details" aria-expanded="false" title="Details">
      <svg aria-hidden="true"><use href="#icon-info"></use></svg>
      <span>Details</span>
    </button>
    <button class="edit-tool" id="position-toggle" type="button" aria-label="Enable panel movement" aria-pressed="false" title="Move">
      <svg aria-hidden="true"><use href="#icon-move"></use></svg>
      <span>Move</span>
    </button>
    <button class="edit-tool edit-tool-reset" id="reset-position" type="button" aria-label="Reset panel position" title="Reset">
      <svg aria-hidden="true"><use href="#icon-reset"></use></svg>
      <span>Reset</span>
    </button>
  </nav>

  <iframe id="full-dispatch-frame" title="Full Dispatch" src="full-dispatch.html" hidden></iframe>

  <script src="app.js"></script>
</body>
</html>
